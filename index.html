<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teste Mapa Offline TGR V3</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f2f2f2}
body{display:flex;flex-direction:column}
header{background:#0b8f3a;color:#fff;text-align:center;padding:16px 10px 13px;font-size:22px;font-weight:700}
.info{padding:15px 16px 10px;background:#f2f2f2}
.info div{margin:4px 0;font-size:14px}.online{color:#009b2e;font-weight:700}.offline{color:#c00000;font-weight:700}.ready{color:#009b2e;font-weight:700}
#map{flex:1;min-height:380px;background:#d9d9d9}
.controls{padding:12px 16px 18px;background:#f2f2f2}
button{width:100%;border:0;border-radius:4px;padding:13px 10px;margin:5px 0;background:#0b8f3a;color:white;font-size:14px;font-weight:700;cursor:pointer}
button.secondary{background:#d9d9d9;color:#111}
#progressWrap{display:none;margin:8px 0}
#barOuter{height:12px;background:#ddd;border-radius:8px;overflow:hidden}
#bar{height:100%;width:0;background:#0b8f3a}
#progressText{text-align:center;font-size:13px;margin-top:5px}
#debug{font-size:12px;color:#555;margin-top:7px;word-break:break-word}
</style>
</head>
<body>
<header>TESTE MAPA OFFLINE TGR</header>
<div class="info">
  <div>PMTiles local: <b>mapa_tgr_200km.pmtiles</b></div>
  <div id="net"></div>
  <div id="cacheStatus">Verificando mapa armazenado...</div>
</div>
<div id="map"></div>
<div class="controls">
  <div id="progressWrap" style="display:block">
    <div id="barOuter"><div id="bar"></div></div>
    <div id="progressText">Mapa já armazenado: não é necessário baixar novamente.</div>
  </div>
  <button id="locate">MINHA LOCALIZAÇÃO</button>
  <button id="prepare" class="secondary">PREPARAR PARA USO OFFLINE</button>
  <div id="debug"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<script>
const PM = './mapa_tgr_200km.pmtiles';
const CACHE='tgr-offline-v2';
const TOTAL_FALLBACK=50479235;
const debug=document.getElementById('debug');

function log(s){ debug.textContent=s; }
function netStatus(){
 const el=document.getElementById('net');
 if(navigator.onLine){el.className='online';el.textContent='🟢 ONLINE'}
 else{el.className='offline';el.textContent='🔴 OFFLINE'}
}
addEventListener('online',netStatus); addEventListener('offline',netStatus); netStatus();

async function checkCache(){
 const c=await caches.open(CACHE);
 const r=await c.match(PM);
 const el=document.getElementById('cacheStatus');
 if(r){el.className='ready';el.textContent='🟢 PRONTO PARA OFFLINE'}
 else{el.className='';el.textContent='🟡 Mapa ainda não armazenado'}
}
checkCache();

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js').catch(e=>log('Service Worker: '+e.message));
}

const protocol=new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles',protocol.tile);

const style={
 version:8,
 sources:{
   tgr:{type:'vector',url:'pmtiles://'+new URL(PM,location.href).href}
 },
 layers:[
   {id:'background',type:'background',paint:{'background-color':'#eef0e8'}},
   {id:'earth',type:'fill',source:'tgr','source-layer':'earth',paint:{'fill-color':'#f3f0e6'}},
   {id:'landcover',type:'fill',source:'tgr','source-layer':'landcover',paint:{'fill-color':'#dfe8d5','fill-opacity':0.45}},
   {id:'landuse',type:'fill',source:'tgr','source-layer':'landuse',paint:{'fill-color':'#e5e3d8','fill-opacity':0.5}},
   {id:'water',type:'fill',source:'tgr','source-layer':'water',paint:{'fill-color':'#a8cce5'}},
   {id:'boundaries',type:'line',source:'tgr','source-layer':'boundaries',paint:{'line-color':'#aaa','line-width':1,'line-dasharray':[3,2]}},
   {id:'roads-casing',type:'line',source:'tgr','source-layer':'roads',paint:{'line-color':'#c6bfae','line-width':['interpolate',['linear'],['zoom'],5,1,10,3,15,8]}},
   {id:'roads',type:'line',source:'tgr','source-layer':'roads',paint:{'line-color':'#ffffff','line-width':['interpolate',['linear'],['zoom'],5,0.6,10,2,15,6]}},
   {id:'buildings',type:'fill',source:'tgr','source-layer':'buildings',minzoom:13,paint:{'fill-color':'#d0c8bd','fill-outline-color':'#b5ada3'}}
 ]
};

let map;
try{
 map=new maplibregl.Map({
   container:'map',
   style,
   center:[-41.85261931399753,-11.295674247278528],
   zoom:7.2,
   attributionControl:false
 });
 map.addControl(new maplibregl.NavigationControl(),'top-right');
 map.on('load',()=>log('Mapa carregado. Se as ruas aparecerem, teste depois em modo avião.'));
 map.on('error',e=>{ if(e && e.error) log('Erro do mapa: '+e.error.message); });
}catch(e){log('Erro ao iniciar mapa: '+e.message)}

document.getElementById('locate').onclick=()=>{
 if(!navigator.geolocation){log('Geolocalização não disponível.');return}
 navigator.geolocation.getCurrentPosition(p=>{
   const ll=[p.coords.longitude,p.coords.latitude];
   new maplibregl.Marker().setLngLat(ll).addTo(map);
   map.flyTo({center:ll,zoom:14});
 },e=>log('GPS: '+e.message),{enableHighAccuracy:true,timeout:15000});
};

document.getElementById('prepare').onclick=async()=>{
 const wrap=document.getElementById('progressWrap'),bar=document.getElementById('bar'),txt=document.getElementById('progressText');
 wrap.style.display='block'; bar.style.width='0%'; txt.textContent='Iniciando...';
 try{
   const resp=await fetch(PM+'?download='+Date.now(),{cache:'no-store'});
   if(!resp.ok) throw new Error('HTTP '+resp.status);
   const total=Number(resp.headers.get('content-length'))||TOTAL_FALLBACK;
   const reader=resp.body.getReader(),chunks=[]; let got=0; const start=performance.now();
   while(true){
     const {done,value}=await reader.read(); if(done)break;
     chunks.push(value); got+=value.byteLength;
     const pct=Math.min(100,got/total*100);
     const secs=(performance.now()-start)/1000;
     const speed=secs?got/1048576/secs:0;
     bar.style.width=pct.toFixed(1)+'%';
     txt.textContent=`${pct.toFixed(1)}% — ${(got/1048576).toFixed(1)} MB / ${(total/1048576).toFixed(1)} MB — ${speed.toFixed(2)} MB/s`;
   }
   const blob=new Blob(chunks,{type:'application/octet-stream'});
   const c=await caches.open(CACHE);
   await c.put(PM,new Response(blob,{headers:{'Content-Type':'application/octet-stream','Content-Length':String(blob.size)}}));
   bar.style.width='100%'; txt.textContent=`100% — ${(blob.size/1048576).toFixed(1)} MB armazenados`;
   await checkCache();
   log('Mapa armazenado. Recarregue a página e depois teste sem internet.');
 }catch(e){log('Falha ao preparar offline: '+e.message)}
};
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teste Mapa Offline TGR</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<style>
html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif} #map{background:#eef0ea}
.painel{position:absolute;z-index:10;top:12px;left:12px;width:min(360px,calc(100vw - 24px));background:#fff;padding:13px;border-radius:12px;box-shadow:0 3px 16px #0004;box-sizing:border-box}
h3{margin:0 0 5px;color:#b90000}.sub{font-size:12px;color:#666;margin-bottom:10px}
.status{display:flex;gap:7px;align-items:center;font-size:13px;margin:6px 0}.bolinha{width:10px;height:10px;border-radius:50%;background:#999}.ok{background:#169b45}.erro{background:#c00000}.aviso{background:#e7a300}
button{width:100%;border:0;border-radius:8px;padding:11px;font-weight:700;cursor:pointer;margin-top:7px;background:#c00000;color:#fff} button.sec{background:#333}
.info{font-size:11px;color:#555;line-height:1.4;margin-top:9px} #msg{font-size:12px;font-weight:700;margin-top:8px}
.barra{height:14px;background:#ddd;border-radius:8px;overflow:hidden}.bar{height:100%;width:0%;background:#c00000;transition:width .15s}
.markerGPS{width:18px;height:18px;background:#1976d2;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 3px #1976d255}
</style>
</head>
<body>
<div id="map"></div>
<div class="painel">
<h3>Teste de mapa offline TGR</h3>
<div class="sub">PMTiles local: mapa_tgr_200km.pmtiles</div>
<div class="status"><span id="redeDot" class="bolinha"></span><span id="redeTxt">Verificando...</span></div>
<div class="status"><span id="cacheDot" class="bolinha"></span><span id="cacheTxt">Verificando mapa offline...</span></div>
<button id="gps">MINHA LOCALIZAÇÃO</button>
<button class="sec" id="baixar">PREPARAR PARA USO OFFLINE</button>
<div id="msg"></div>
<div id="prog" style="display:none;margin-top:9px"><div class="barra"><div id="bar" class="bar"></div></div><div id="txt" style="font-size:12px;margin-top:5px;font-weight:700">0%</div></div>
<div class="info">Nesta versão o próprio navegador baixa o PMTiles e mostra o progresso real. Ao concluir, ative o modo avião e recarregue a página.</div>
</div>
<script src="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<script>
const MAPA='./mapa_tgr_200km.pmtiles', CACHE='tgr-offline-v2';
let mapa,gpsMarker;

function rede(){
 const on=navigator.onLine;
 redeDot.className='bolinha '+(on?'ok':'erro'); redeTxt.textContent=on?'ONLINE':'OFFLINE';
}
addEventListener('online',rede);addEventListener('offline',rede);rede();

async function cacheStatus(){
 try{
  const c=await caches.open(CACHE), r=await c.match(MAPA,{ignoreSearch:true});
  cacheDot.className='bolinha '+(r?'ok':'aviso');
  cacheTxt.textContent=r?'PRONTO PARA OFFLINE':'Mapa ainda não armazenado';
 }catch(e){cacheDot.className='bolinha erro';cacheTxt.textContent='Cache indisponível';}
}

async function preparar(){
 prog.style.display='block'; bar.style.width='0%'; txt.textContent='Conectando...'; msg.textContent='Iniciando download...';
 try{
  const resp=await fetch(MAPA+'?download='+Date.now(),{cache:'no-store'});
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  const total=Number(resp.headers.get('content-length'))||50479235;
  if(!resp.body) throw new Error('Download por fluxo não suportado.');
  const reader=resp.body.getReader(), chunks=[];
  let loaded=0, t0=performance.now(), b0=0;
  while(true){
   const {done,value}=await reader.read(); if(done)break;
   chunks.push(value); loaded+=value.byteLength;
   const now=performance.now();
   if(now-t0>250){
    const pct=Math.min(100,loaded/total*100), vel=(loaded-b0)/((now-t0)/1000);
    bar.style.width=pct.toFixed(1)+'%';
    txt.textContent=`${pct.toFixed(1)}% — ${(loaded/1048576).toFixed(1)} MB / ${(total/1048576).toFixed(1)} MB — ${(vel/1048576).toFixed(2)} MB/s`;
    t0=now;b0=loaded;
   }
  }
  const blob=new Blob(chunks,{type:'application/octet-stream'});
  msg.textContent='Download concluído. Gravando no aparelho...';
  const c=await caches.open(CACHE);
  await c.put(MAPA,new Response(blob,{headers:{'Content-Type':'application/octet-stream','Content-Length':String(blob.size),'Accept-Ranges':'bytes'}}));
  bar.style.width='100%';txt.textContent=`100% — ${(blob.size/1048576).toFixed(1)} MB armazenados`;
  msg.textContent='PRONTO PARA OFFLINE ✓';
  await cacheStatus();
 }catch(e){msg.textContent='ERRO: '+e.message; cacheDot.className='bolinha erro';}
}
baixar.onclick=preparar;

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(cacheStatus).catch(e=>{msg.textContent='SW: '+e.message});
}else cacheStatus();

const protocol=new pmtiles.Protocol(); maplibregl.addProtocol('pmtiles',protocol.tile);
const arquivo=new pmtiles.PMTiles(MAPA); protocol.add(arquivo);
arquivo.getHeader().then(h=>{
 mapa=new maplibregl.Map({
  container:'map',center:[h.centerLon,h.centerLat],zoom:Math.max(7,Math.min(12,h.maxZoom-3)),maxZoom:19,
  style:{version:8,sources:{tgr:{type:'vector',url:'pmtiles://'+MAPA,attribution:'© OpenStreetMap contributors'}},
  layers:[
   {id:'fundo',type:'background',paint:{'background-color':'#eef0ea'}},
   {id:'agua',type:'fill',source:'tgr','source-layer':'water',paint:{'fill-color':'#b9d9ec'}},
   {id:'terra',type:'fill',source:'tgr','source-layer':'landuse',paint:{'fill-color':'#e7eadf','fill-opacity':.55}},
   {id:'predios',type:'fill',source:'tgr','source-layer':'buildings',minzoom:13,paint:{'fill-color':'#d7d1c8','fill-outline-color':'#c3bbb0'}},
   {id:'ruas',type:'line',source:'tgr','source-layer':'roads',paint:{'line-color':'#888','line-width':['interpolate',['linear'],['zoom'],7,.6,12,1.5,16,4]}}
  ]}
 });
 mapa.addControl(new maplibregl.NavigationControl(),'bottom-right');
}).catch(e=>msg.textContent='Erro ao abrir mapa: '+e.message);

gps.onclick=()=>{
 if(!navigator.geolocation)return alert('GPS não disponível.');
 msg.textContent='Buscando localização...';
 navigator.geolocation.getCurrentPosition(pos=>{
  const c=[pos.coords.longitude,pos.coords.latitude];
  if(!gpsMarker){const el=document.createElement('div');el.className='markerGPS';gpsMarker=new maplibregl.Marker({element:el}).setLngLat(c).addTo(mapa)}
  else gpsMarker.setLngLat(c);
  mapa.flyTo({center:c,zoom:15}); msg.textContent='GPS encontrado — precisão ~'+Math.round(pos.coords.accuracy)+' m';
 },e=>msg.textContent='GPS: '+e.message,{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
};
cacheStatus();
</script>
</body></html>
